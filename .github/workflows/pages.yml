name: Web app

# Every push to main rebuilds the web app (scene/build-web.mjs) and publishes it on GitHub Pages,
# for phones and tablets: open it in Safari, then Share > Add to Home Screen. Installed copies pick up
# a new VERSION the next time they're opened with a connection.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        working-directory: scene
        run: |
          npm ci
          node build-web.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
